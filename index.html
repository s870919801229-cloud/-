var tabs=document.getElementById('tabs'), panels=document.getElementById('panels');
function el(t,c,x){var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e}
D.forEach(function(d,i){
  var b=el('button'); b.setAttribute('role','tab'); b.id='t-'+d.id; b.setAttribute('aria-controls','p-'+d.id);
  b.style.setProperty('--tc','var('+d.c+')');
  b.appendChild(el('small',null,d.w?('Day '+(i+1)):'清單')); b.appendChild(el('b',null,d.w?d.m+' '+d.w:d.m));
  b.addEventListener('click',function(){show(d.id,true)});
  tabs.appendChild(b);
  var p=el('section'); p.setAttribute('role','tabpanel'); p.id='p-'+d.id; p.setAttribute('aria-labelledby','t-'+d.id); p.hidden=true;
  p.style.setProperty('--tc','var('+d.c+')');
  p.appendChild(el('div','ttl',d.w?(d.m+' '+d.w+'・'+d.t):d.t));
  d.r.forEach(function(r){
    var row=el('div','row'+(d.chk?' chk':'')); row.appendChild(el('span','tm',r[0]));
    var tx=el('span','tx',r[1]); if(r[2]) tx.appendChild(el('span','nt',r[2])); if(r[3]) tx.appendChild(el('span','tk',r[3])); if(r[4]) tx.appendChild(el('span','pl',r[4])); row.appendChild(tx); p.appendChild(row);
  });
  panels.appendChild(p);
});
function show(id,push){
  D.forEach(function(d){
    var on=d.id===id, t=document.getElementById('t-'+d.id);
    t.setAttribute('aria-selected',on); t.tabIndex=on?0:-1; document.getElementById('p-'+d.id).hidden=!on;
    if(on&&push){try{history.replaceState(null,'','#'+id)}catch(e){} t.scrollIntoView({block:'nearest',inline:'center'}); window.scrollTo(0,0)}
  });
}
tabs.addEventListener('keydown',function(e){
  var i=D.findIndex(function(d){return document.getElementById('t-'+d.id).getAttribute('aria-selected')==='true'});
  if(e.key==='ArrowRight')i=(i+1)%D.length; else if(e.key==='ArrowLeft')i=(i+D.length-1)%D.length; else return;
  show(D[i].id,true); document.getElementById('t-'+D[i].id).focus();
});
function start(){
  var h=location.hash.slice(1), ok=D.some(function(d){return d.id===h});
  if(!ok){var n=new Date(), k=n.getFullYear()*10000+(n.getMonth()+1)*100+n.getDate();
    h=(k>=20270110&&k<=20270114)?'d'+(k-20270109):'d1'}
  show(h,false);
}
window.addEventListener('hashchange',start); start();
