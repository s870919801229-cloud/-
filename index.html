const dist=(a,b,c,d)=>{const x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;return 6371*2*Math.asin(Math.sqrt(Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2))};
const tm=t=>{const m=String(t).match(/(\d\d)-(\d\d)T(\d\d:\d\d)/);return m?(+m[1])+'/'+(+m[2])+' '+m[3]:String(t)};
const dir=v=>{if(v===null)return '—';if(v===0)return '靜穩';const names=['靜穩','北北東','東北','東北東','東','東南東','東南','南南東','南','南南西','西南','西南西','西','西北西','西北','北北西','北'];return names[v]||'—'};
let selected=0,results=[],busy=false,table=null;
const box=$('wxPlaces'),refresh=$('wxRefresh');
places.forEach((p,i)=>{const b=make('button','wxplace');b.type='button';b.addEventListener('click',()=>{selected=i;renderPlaces();renderDetail()});b.append(make('b',null,p.name),make('span',null,'⏳'),make('small',null,'載入中'));box.appendChild(b)});
function renderPlaces(){[...box.children].forEach((b,i)=>{b.classList.toggle('active',i===selected);const d=results[i];b.replaceChildren(make('b',null,places[i].name),make('span',null,d?'🌡️':'—'),make('small',null,d?fmt(valid(d.obs.temp),'°C'):'暫無資料'))})}
function fmt(v,u=''){return v===null||v===undefined?'—':(Math.round(v*10)/10)+u}
async function getJMA(){if(!table){const r=await fetch(JMA+'/const/amedastable.json',{cache:'no-store'});if(!r.ok)throw Error('JMA 測站清單讀取失敗');table=await r.json()}
const tr=await fetch(JMA+'/data/latest_time.txt',{cache:'no-store'});if(!tr.ok)throw Error('JMA 最新時間讀取失敗');const latest=(await tr.text()).trim();const stamp=latest.replace(/\D/g,'').slice(0,14);const mr=await fetch(JMA+'/data/map/'+stamp+'.json',{cache:'no-store'});if(!mr.ok)throw Error('JMA 測站觀測資料讀取失敗');return{map:await mr.json(),latest}}
function nearest(p,map){let best=null;Object.keys(table).forEach(id=>{const s=table[id],o=map[id];if(!o||!s.lat||!s.lon)return;const t=valid(o.temp);if(t===null)return;const km=dist(p.lat,p.lon,coord(s.lat),coord(s.lon));if(!best||km<best.km)best={id,s,o,km}});return best}
async function forecast(p){const u=OM+'?latitude='+p.lat+'&longitude='+p.lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,precipitation_probability,precipitation,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=7&temperature_unit=celsius&wind_speed_unit=kmh&precipitation_unit=mm';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('預報服務暫時無法使用');return r.json()}
function renderDetail(){const d=results[selected];if(!d)return;const o=d.o,obs=d.obs,fc=d.forecast.current,w=valid(obs.wind),wd=valid(obs.windDirection),rain=valid(obs.precipitation1h),hum=valid(obs.humidity),temp=valid(obs.temp);
$('wnI').textContent=(C[fc.weather_code]||['🌡️','天氣'])[0];$('wnT').textContent=places[selected].name+' '+fmt(temp,'°C')+'｜測站實測';$('wnS').textContent='JMA 測站：'+d.station.s.kjName+'｜距離約 '+Math.round(d.station.km)+' 公里｜日本時間 '+tm(d.latest);
const stats=$('wxStats');stats.replaceChildren();[['🌡️ 實測氣溫',fmt(temp,'°C')],['💧 相對濕度',fmt(hum,'%')],['💨 平均風速',fmt(w,' m/s')],['🧭 風向',dir(wd)],['🌧️ 1小時雨量',fmt(rain,' mm')],['☀️ 體感溫度（預報模型）',fmt(fc.apparent_temperature,'°C')]].forEach(x=>{const b=make('div','wxstat');b.append(make('b',null,x[0]),make('div',null,x[1]));stats.appendChild(b)});
const h=d.forecast.hourly,hb=$('wxHour');hb.replaceChildren();let start=h.time.findIndex(t=>new Date(t).getTime()>=Date.now());if(start<0)start=0;for(let i=start;i<Math.min(start+24,h.time.length);i++){const wc=C[h.weather_code[i]]||['🌡️','天氣'];const item=make('div','wxhouritem');item.append(make('b',null,h.time[i].slice(11,16)),make('div','e',wc[0]),make('div',null,fmt(h.temperature_2m[i],'°')),make('small',null,'雨 '+fmt(h.precipitation_probability[i],'%')),make('small',null,fmt(h.precipitation[i],' mm')));hb.appendChild(item)}
const days=d.forecast.daily,db=$('wDays'),week=['日','一','二','三','四','五','六'];db.replaceChildren();days.time.forEach((date,i)=>{const day=new Date(date+'T12:00:00+09:00'),wc=C[days.weather_code[i]]||['🌡️','天氣'];const item=make('div','wd');item.append(make('small',null,(day.getMonth()+1)+'/'+day.getDate()+' '+week[day.getDay()]),make('span','e',wc[0]),make('b',null,Math.round(days.temperature_2m_min[i])+'–'+Math.round(days.temperature_2m_max[i])+'°'),make('i',null,'雨 '+fmt(days.precipitation_probability_max[i],'%')));db.appendChild(item)});
$('wCap').textContent='現在實況：日本氣象廳 JMA AMeDAS 地面測站（測站 '+d.station.s.kjName+'，距景點約 '+Math.round(d.station.km)+' km）｜觀測時間 '+tm(d.latest)+'。逐小時與7日為 Open-Meteo 預報模型，並非實測。';
$('wxTime').textContent='🌺 五地天氣｜JMA 最新觀測 '+tm(d.latest)}
async function load(){if(busy)return;busy=true;refresh.disabled=true;refresh.textContent='更新中…';$('wxTime').textContent='正在更新 JMA 實測及天氣預報…';try{const j=await getJMA();const settled=await Promise.allSettled(places.map(async p=>{const station=nearest(p,j.map);if(!station)throw Error('附近沒有有效測站');const f=await forecast(p);return{station,o:station.o,obs:station.o,forecast:f,latest:j.latest}}));results=settled.map(r=>r.status==='fulfilled'?r.value:null);renderPlaces();if(results[selected])renderDetail();else{const i=results.findIndex(Boolean);if(i>=0){selected=i;renderPlaces();renderDetail()}else throw Error('目前沒有可用測站資料')}}catch(e){console.error(e);$('wxTime').textContent='更新失敗｜保留上次成功資料';$('wCap').textContent='無法取得最新觀測，請稍後按「更新」。若持續失敗，可能是 JMA 端點或瀏覽器跨網域限制。'}finally{refresh.disabled=false;refresh.textContent='↻ 更新';busy=false}}
refresh.addEventListener('click',load);load();setInterval(load,10*60*1000);
})();
</script>
</body>
